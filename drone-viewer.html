<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drone time series · REWRITE</title>
  <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="assets/drone/viewer.css">
  <script src="assets/vendor/leaflet/leaflet.js" defer></script>
  <script src="assets/drone/viewer.js" defer></script>
</head>
<body>
  <header class="viewer-header">
    <div class="viewer-title"><a href="remote-sensing.html" class="back-link">← Results</a><h1>Drone time series</h1><span id="period-range"></span></div>
    <nav aria-label="Map controls">
      <button type="button" data-reset="stable">Reset stable</button>
      <button type="button" data-reset="unstable">Reset unstable</button>
      <button type="button" id="fullscreen-button">Full screen</button>
    </nav>
  </header>
  <main class="mosaic-layout" aria-label="Drone map mosaics">
    <section class="mosaic stable" data-site="stable" data-kind="RGB" aria-labelledby="stable-rgb-title">
      <header><h2 id="stable-rgb-title">Stable meadow <span>RGB</span></h2></header><div class="map-grid"></div>
    </section>
    <section class="mosaic unstable" data-site="unstable" data-kind="RGB" aria-labelledby="unstable-rgb-title">
      <header><h2 id="unstable-rgb-title">Unstable meadow <span>RGB</span></h2></header><div class="map-grid"></div>
    </section>
    <section class="mosaic stable" data-site="stable" data-kind="NDVI" aria-labelledby="stable-ndvi-title">
      <header><h2 id="stable-ndvi-title">Stable meadow <span>NDVI</span></h2></header><div class="map-grid"></div>
    </section>
    <section class="mosaic unstable" data-site="unstable" data-kind="NDVI" aria-labelledby="unstable-ndvi-title">
      <header><h2 id="unstable-ndvi-title">Unstable meadow <span>NDVI</span></h2></header><div class="map-grid"></div>
    </section>
  </main>
  <footer class="viewer-footer">
    <div class="legend"><strong>NDVI</strong><span>0</span><span class="legend-gradient" aria-label="Batlow NDVI colour scale from zero to 0.8"><i>0.4</i></span><span>0.8</span><span class="legend-unit">unitless</span></div>
    <p id="viewer-status" class="sr-only" role="status">Loading map series…</p>
  </footer>
  <noscript><p class="fatal-error">The drone map series could not be displayed.</p></noscript>
</body>
</html>
